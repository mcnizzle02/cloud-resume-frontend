# Cloud Resume Challenge - frontend CI/CD (Azure Static Web Apps)
#
# On every push to main: sign in to Azure with OIDC, fetch the Static Web
# App's deployment token at run time (it is never stored in GitHub), and
# deploy only the website files.

name: Frontend CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-cloud-resume
  STATIC_WEB_APP: swa-cloud-resume
  SITE_URL: https://leemcnutt.dev

jobs:
  deploy:
    name: Deploy website
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      # Allowlist: only these file types are published.
      - name: Stage website files
        run: |
          mkdir dist
          cp ./*.html ./*.css ./*.js staticwebapp.config.json dist/
          ls -la dist

      - name: Sign in to Azure (OIDC, no secrets)
        uses: azure/login@v2 # match the version used in the backend workflow
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch deployment token
        id: token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "$STATIC_WEB_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.apiKey -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true

      - name: Smoke test the live site
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL")
          echo "HTTP $STATUS from $SITE_URL"
          [ "$STATUS" = "200" ]
